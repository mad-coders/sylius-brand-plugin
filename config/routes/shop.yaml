# Shop routes contributed by the plugin. Imported by the host application under the localised shop
# route prefix (see docs/INSTALLATION.md).

madcoders_sylius_brand_shop_brand_index:
    path: /brands
    methods: [GET]
    defaults:
        _controller: Madcoders\SyliusBrandPlugin\Controller\Shop\BrandController::indexAction

madcoders_sylius_brand_shop_brand_show:
    path: /brands/{slug}
    methods: [GET]
    defaults:
        _controller: Madcoders\SyliusBrandPlugin\Controller\Shop\BrandController::showAction
    requirements:
        # Slugs are generated by Sylius' slug generator, so they never contain a slash. Constraining
        # the placeholder keeps `/brands/nike/anything` a 404 rather than a slug lookup that can
        # never match.
        slug: "[^/]+"
