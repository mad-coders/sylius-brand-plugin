# Plugin configuration entry point.
#
# Everything the plugin contributes to the host application is imported from here, so a host
# application only has to import this single file (see docs/INSTALLATION.md).

imports:
    - { resource: "resources.yaml" }
    - { resource: "fixtures.yaml" }
    - { resource: "grids/**/*.yaml" }
    - { resource: "twig_hooks/*.yaml" }

# Two files are deliberately NOT imported here:
#
#   settings.yaml       registers the plugin's section with MonsieurBiz' Settings plugin
#   liip_imagine.yaml   registers the brand logo filter sets
#
# Both configure extensions that belong to *other* bundles, and importing configuration for an
# extension the host has not registered is a hard container failure. The plugin's extension prepends
# them only when the corresponding bundle is present - see MadcodersSyliusBrandExtension.
