# Behat suite definitions contributed by the plugin.

default:
    suites:
        madcoders_brand_admin:
            contexts:
                - sylius.behat.context.hook.doctrine_orm

                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.shared_storage

                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.currency
                - sylius.behat.context.setup.locale
                - sylius.behat.context.setup.admin_security

                - madcoders_sylius_brand.behat.context.setup.brand
                - madcoders_sylius_brand.behat.context.setup.brand_settings
                - madcoders_sylius_brand.behat.context.setup.brand_product

                # Provides "I should be notified that it has been successfully created/edited".
                # Note what is NOT here: sylius.behat.context.ui.admin.managing_administrators.
                # Pulling in a resource context this suite does not exercise makes its generic
                # steps ("I add it", "I save my changes") ambiguous against ours.
                - sylius.behat.context.ui.admin.notification
                - madcoders_sylius_brand.behat.context.ui.admin.managing_brands

            filters:
                tags: "@madcoders_brand_admin"

        madcoders_brand_shop:
            contexts:
                - sylius.behat.context.hook.doctrine_orm

                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.shared_storage

                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.currency
                - sylius.behat.context.setup.locale

                - madcoders_sylius_brand.behat.context.setup.brand
                - madcoders_sylius_brand.behat.context.setup.brand_settings
                - madcoders_sylius_brand.behat.context.setup.brand_product

                - madcoders_sylius_brand.behat.context.ui.shop.brand

            filters:
                tags: "@madcoders_brand_shop"

        madcoders_brand_resolution:
            contexts:
                - sylius.behat.context.hook.doctrine_orm

                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.shared_storage

                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.currency
                - sylius.behat.context.setup.locale

                - madcoders_sylius_brand.behat.context.setup.brand
                - madcoders_sylius_brand.behat.context.setup.brand_settings
                - madcoders_sylius_brand.behat.context.setup.brand_product

            filters:
                tags: "@madcoders_brand_resolution"
